<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- Meta Tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="description" content="رسالة حب رومانسية، نسجل فيها كل يومٍ نقضيه معًا">
  <meta name="author" content="qzydustin">
  <meta name="theme-color" content="#ffe">

  <!-- Open Graph -->
  <meta property="og:title" content="رسالة حب | Love Letter">
  <meta property="og:description" content="رسالة حب رومانسية، نسجل فيها كل يومٍ نقضيه معًا">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://love.qzydustin.com">

  <!-- Title & Resources -->
  <title>رسالة حب | Love Letter</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>document.documentElement.classList.add("mobile");</script>
  <script src="config.js"></script>
</head>
<body>
  <!-- Background Music -->
  <audio loop id="bgm" preload="auto" aria-label="موسيقى خلفية">
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>
  
  <!-- Main Container -->
  <div id="viewport">
    <div id="main">
      <div id="canvas-wrap">
        <canvas id="ground-canvas" aria-hidden="true"></canvas>
        <canvas id="static-canvas" aria-hidden="true"></canvas>
        <canvas id="canvas" aria-label="شجرة متحركة مع قلوب"></canvas>
        <button id="tap-heart" type="button" hidden>
          <span class="tap-heart-icon" aria-hidden="true">❤</span>
          <span class="tap-heart-text">اضغط على القلب</span>
        </button>
      </div>

      <div id="letter" role="article"></div>

      <div id="clock-box" role="timer">
        <div id="clock-text"></div>
        <div id="clock"></div>
      </div>
    </div>
  </div>
  
  <!-- Main Script -->
  <script src="js/geometry.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
